[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-kinesis-stream-audit"
version = "0.1.0"
description = "Audit Amazon Kinesis Data Streams for retention, encryption, shard capacity, stale enhanced fan-out consumers and missing shard-level metrics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Tarassov", email = "michael@tarassov.me" }]
keywords = ["aws", "kinesis", "audit", "sre", "cost-optimization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "PyYAML>=6.0"]

[project.scripts]
aws-kinesis-stream-audit = "aws_kinesis_stream_audit.cli:main"

[project.urls]
Homepage = "https://github.com/moveeeax/aws-kinesis-stream-audit"
Issues = "https://github.com/moveeeax/aws-kinesis-stream-audit/issues"

[tool.setuptools]
packages = ["aws_kinesis_stream_audit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
